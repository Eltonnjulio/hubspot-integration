server:
  port: 8080

spring:
  application:
    name: hubspot-integration
  security:
    user:
      name: ${INTEGRATION_USERNAME}
      password: ${INTEGRATION_PASSWORD}
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/hubspot;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  codec:
    max-in-memory-size: 256KB

logging:
  level:
    root: INFO

hubspot:
  retry:
    max-retries: 3
    initial-delay: 1s
    max-delay: 60s
  api:
    base-url: https://api.hubapi.com

  oauth:
    client-id: ${HUBSPOT_CLIENT_ID}
    client-secret: ${HUBSPOT_CLIENT_SECRET}
    redirect-uri: ${HUBSPOT_REDIRECT_URI:http://localhost:8080/oauth/callback}
    authorization-uri: https://app.hubspot.com/oauth/authorize
    token-uri: /oauth/v1/token
    scopes: "crm.objects.contacts.write crm.objects.contacts.read oauth"

  webhook:
    client-secret: ${hubspot.oauth.client-secret}

resilience4j:
  ratelimiter:
    instances:
      hubspotApi:
        limitForPeriod: 9
        limitRefreshPeriod: 1s
        timeoutDuration: 0s

http:
  client:
    connect-timeout: 5s
    read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

storage:
  encryption-key: ${TOKEN_ENCRYPTION_KEY}
