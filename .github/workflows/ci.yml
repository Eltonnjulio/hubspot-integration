name: Java CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hubspot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: PostgreSQL persistence and concurrency
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/hubspot_test
          TEST_DATABASE_USERNAME: postgres
          TEST_DATABASE_PASSWORD: postgres
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=DurableStorageTest test
